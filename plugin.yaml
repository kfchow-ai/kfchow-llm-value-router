name: kfchow-llm-value-router
version: "1.0.8"
description: "Per-turn LLM model routing guided by the KFChow value leaderboard. On the first provider call of a turn, a vendor classifier picks a tier on a 4-rung ladder (free / flash / mid / premium) and in live mode rewrites the request model to that tier's rung. Source-agnostic: works from any default model (premium, mid, flash or foreign), moving both up and down its own provider's rungs. Per-request kill switch (v1.0.8): a client can disable routing for its own request with the X-KFC-Router header (or a router body field) — no rewrite, no classifier call, no credit probe, one log row. Fail-open, shadow-by-default."
author: KFChow
license: MIT
requires_hermes: ">=0.21.5"
provides_middleware:
  - llm_request
  - llm_execution
optional_env:
  - NOUS_API_KEY
  - JEVI_API_KEY
config_schema:
  enabled:
    type: bool
    default: true
    description: "Master switch. When false the middleware returns None immediately."
  mode:
    type: str
    default: shadow
    description: "shadow = decide and log only; live = rewrite the request model. Stays shadow until a human flips it."
  confidence_gate:
    type: float
    default: 0.65
    description: "Minimum classifier confidence to rewrite the model (free tier)."
  feed_url:
    type: str
    default: "https://kfchow.com/llm-value-leaderboard/feed.xml"
    description: "KFChow value leaderboard feed (ranking lives in ITEM descriptions)."
  rungs_path:
    type: str
    default: "~/.hermes/jev/llm_rungs.json"
    description: "Where llm-rank-resolver.py writes the resolved rungs."
  route_providers:
    type: list
    description: "Providers eligible for the free-tier downgrade path."
  source_mode:
    type: str
    default: any
    description: "Which SOURCE models are eligible (v1.0.7). any = provider match only, so any default model moves both ways on its own provider's rungs (route_models/escalate_models ignored); allowlist = exact v1.0.6 behaviour (source must be in route_models or escalate_models); a JSON list of model ids in lane2_config.json = only those exact sources. Unrecognised values fall back to allowlist with one warning."
  route_models:
    type: list
    description: "Model ids eligible for the free-tier downgrade path (consulted only when source_mode is allowlist)."
  free_model:
    type: str
    description: "Flat free-tier fallback rung (per-provider rungs take precedence)."
  flash_gate:
    type: float
    default: 0.35
    description: "Lower bound of the FLASH band: free-pool turns with flash_gate <= confidence < confidence_gate route to the flash rung instead of staying mid."
  flash_model:
    type: str
    description: "Flat flash-tier fallback rung (per-provider rungs take precedence)."
  escalate_enabled:
    type: bool
    default: true
    description: "Enable the mid -> premium escalation path."
  escalate_providers:
    type: list
    description: "Providers eligible for escalation (must match the turn's originating provider)."
  escalate_models:
    type: list
    description: "Mid-rung model ids eligible for escalation (consulted only when source_mode is allowlist)."
  premium_model:
    type: str
    description: "Flat premium fallback rung (per-provider rungs take precedence)."
  escalate_confidence_gate:
    type: float
    default: 0.80
    description: "Escalation gate (premium tier); falls back to the code default 0.80 when unset."
  credit_probe:
    type: bool
    default: true
    description: "Before escalating on a metered provider, probe the paid lane; fail-closed when dark."
  send_excerpt:
    type: bool
    default: true
    description: "Send a capped last-user-message excerpt to the vendor and include it in the local log. Set false to keep task text out of both (reduces accuracy)."
  excerpt_chars:
    type: int
    default: 1200
    description: "Cap for the task excerpt (last user message)."
  jev_timeout_s:
    type: float
    default: 10
    description: "Vendor classify timeout in seconds; on timeout the turn proceeds unchanged (fail-open)."
